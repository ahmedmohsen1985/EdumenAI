version: '3.8'

services:
  edumenai-app:
    build: .
    container_name: edumenai-exercise4
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AI_PROVIDER=${AI_PROVIDER:-google}
      - AI_MODEL=${AI_MODEL:-}
      - AI_VISION_PROVIDER=${AI_VISION_PROVIDER:-}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-}
      - AI_EVAL_PROVIDER=${AI_EVAL_PROVIDER:-}
      - AI_EVAL_MODEL=${AI_EVAL_MODEL:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-120000}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-7-sonnet-latest}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_PDF_ENGINE=${OPENROUTER_PDF_ENGINE:-}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-https://edumenai.the-amaj.com}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-EdumenAI Exercise 4}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_TEACHER_GROUP_ID=${TELEGRAM_TEACHER_GROUP_ID}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-86400}
    volumes:
      - ./uploads:/app/uploads
